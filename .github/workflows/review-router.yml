name: Review Router

# SECURITY: Use "pull_request" only — NEVER "pull_request_target".
# pull_request does not pass secrets to fork PRs (safe).
# pull_request_target does pass secrets to fork PRs (unsafe — credentials leak risk).
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-latest
    if: github.event.action == 'labeled' && github.event.label.name == 'Ready for Review'
    steps:
      - uses: datarobot-community/review-router@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
